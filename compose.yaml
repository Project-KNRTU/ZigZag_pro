services:
  zigzag-app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: zigzag-app

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_PATH: /app/data/zigzag.db

    command:
      - node
      - server.js

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - zigzag-data:/app/data

  zigzag-bot:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: zigzag-bot

    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_EXTRA_CA_CERTS: /app/certs/max-ca.pem

    command:
      - node
      - bot.mjs

    depends_on:
      - zigzag-app

volumes:
  zigzag-data: