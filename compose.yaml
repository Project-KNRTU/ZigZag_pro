services:
  zigzag-app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: zigzag-app

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "3000:3000"

    volumes:
      - zigzag-data:/app/data

  zigzag-bot:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: zigzag-bot

    restart: unless-stopped

    env_file:
      - .env

    command:
      - node
      - bot.mjs

volumes:
  zigzag-data: